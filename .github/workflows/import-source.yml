name: Importar fontes da v0.1.0
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-source.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency: import-source-v010
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar e importar arquivos editáveis publicados
        run: |
          python3 - <<'PY'
          import hashlib, io, pathlib, urllib.request, zipfile
          url = 'https://github.com/edhard-remakes/Super-Street-Fighter-Turbo-Remake-/releases/download/v0.1.0/SF2-Remake-v0.1.0-codigo-fonte.zip'
          expected = '461c39e50c366823ae0e606a4f46e546e433f608828c4be9036b57aeac7bc950'
          request = urllib.request.Request(url, headers={'User-Agent': 'SF2-source-import'})
          payload = urllib.request.urlopen(request, timeout=120).read()
          assert hashlib.sha256(payload).hexdigest() == expected, 'Source archive checksum mismatch'
          archive = zipfile.ZipFile(io.BytesIO(payload))
          assert len(archive.infolist()) == 372
          prefix = 'SF2-Remake-v0.1.0-source/'
          for entry in archive.infolist():
              assert entry.filename.startswith(prefix)
              relative = pathlib.PurePosixPath(entry.filename[len(prefix):])
              assert not relative.is_absolute() and '..' not in relative.parts
              assert relative.parts[0] in {'game', 'launcher', 'tools', '.gitignore', 'SOURCE-MANIFEST.json', 'README.md'}
              if entry.is_dir():
                  continue
              destination = pathlib.Path('docs/BUILDING.md') if str(relative) == 'README.md' else pathlib.Path(str(relative))
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(archive.read(entry))
          building = pathlib.Path('docs/BUILDING.md')
          text = building.read_text(encoding='utf-8')
          text = text.replace('Este pacote reúne', 'Este repositório reúne').replace('Este ZIP de fontes', 'O checkout dos fontes')
          text = text.replace('2. Extraia este ZIP para uma pasta de trabalho.', '2. Clone a branch `main` deste repositório para uma pasta de trabalho:\n\n```powershell\ngit clone https://github.com/edhard-remakes/Super-Street-Fighter-Turbo-Remake-.git\ncd Super-Street-Fighter-Turbo-Remake-\n```')
          text = text.replace('Copie todo o conteúdo dessa pasta para `game/` na pasta de trabalho.', 'Copie todo o conteúdo dessa pasta para uma nova pasta `runtime/` na raiz do checkout, preservando `game/` como os fontes versionados.')
          text = text.replace('5. Sobreponha novamente o conteúdo de `game/` deste ZIP à cópia preparada, preservando os recursos gráficos e sonoros.', '5. Sobreponha os fontes versionados à cópia completa com `robocopy .\\game .\\runtime /E`. Os códigos de saída de 0 a 7 do Robocopy indicam sucesso. Repita essa cópia após editar os fontes para testar as alterações.')
          text = text.replace('execute `game/Ikemen_GO.exe` com o diretório de trabalho em `game/`.', 'execute `runtime/Ikemen_GO.exe` com o diretório de trabalho em `runtime/`.')
          text = text.replace('A pasta `game/` precisa conter todos os recursos e a engine nativa.', 'A pasta `runtime/` precisa conter todos os recursos, a engine nativa e os fontes atualizados conforme os passos acima.')
          text = text.replace('python .\\tools\\build_package.py', 'python .\\tools\\build_package.py --game .\\runtime')
          building.write_text(text, encoding='utf-8')
          ignore = pathlib.Path('.gitignore')
          ignore.write_text(ignore.read_text(encoding='utf-8') + '\nruntime/\ngame/save/config-cache.json\n', encoding='utf-8')
          readme = pathlib.Path('README.md')
          text = readme.read_text(encoding='utf-8').split('## Código fonte e arquivos editáveis')[0].rstrip()
          text += '''\n\n## Código fonte e arquivos editáveis\n\nOs arquivos do projeto estão versionados diretamente na branch **main**:\n\n- [game/](game/): 365 arquivos originais editáveis do jogo, mais a configuração sem endereços salvos; lógica, comandos, animações, cenários, menus, shaders e paletas.\n- [launcher/](launcher/): código C# do inicializador.\n- [tools/](tools/): compilação do launcher e empacotamento portátil em Python.\n- [docs/BUILDING.md](docs/BUILDING.md): preparação da cópia editável, testes locais, compilação e créditos.\n- [SOURCE-MANIFEST.json](SOURCE-MANIFEST.json): hashes dos fontes correspondentes à versão pública v0.1.0.\n\n```powershell\ngit clone https://github.com/edhard-remakes/Super-Street-Fighter-Turbo-Remake-.git\n```\n\nOs recursos grandes (SFF, sons, músicas, vídeos, fontes e engine nativa) continuam no executável do release. Consulte as instruções de preparação em [BUILDING.md](docs/BUILDING.md). Saves pessoais, replays e arquivos temporários não são versionados. O código Go da engine é mantido no [IKEMEN GO](https://github.com/ikemen-engine/Ikemen-GO).\n\nO [ZIP dos fontes da v0.1.0](https://github.com/edhard-remakes/Super-Street-Fighter-Turbo-Remake-/releases/download/v0.1.0/SF2-Remake-v0.1.0-codigo-fonte.zip) continua disponível como download extra. Para consultar e contribuir com os arquivos atuais, use a branch `main`; os arquivos automáticos de tags antigas refletem o conteúdo existente na data de cada tag.\n'''
          readme.write_text(text, encoding='utf-8')
          pathlib.Path('.github/workflows/import-source.yml').unlink()
          print('Imported 372 source files; preserved gallery README.')
          PY
      - name: Versionar arquivos na main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game launcher tools docs/BUILDING.md SOURCE-MANIFEST.json .gitignore README.md
          git commit -m "Versionar fontes do jogo, launcher e ferramentas na main"
          git push origin HEAD:main
